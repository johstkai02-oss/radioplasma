<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RadioPlasma AV - Analizador Acústico</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
  body{background:#020617;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;padding:12px}
  .panel{width:100%;max-width:440px;background:rgba(10,18,34,0.95);border:1px solid #00ffcc;border-radius:12px;padding:14px}
  h1{font-size:14px;color:#00ffcc;text-align:center;margin-bottom:8px}
  canvas{width:100%;height:160px;background:#010409;border:1px solid #38bdf8;border-radius:8px;display:block;margin-bottom:8px}
  .telemetry{display:flex;justify-content:space-between;font-size:10px;color:#38bdf8;margin-bottom:8px;background:#091122;padding:6px;border-radius:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  button{background:#0284c7;color:#fff;border:none;border-radius:6px;padding:10px;font-size:11px;font-weight:bold}
  .b-play{background:#059669} .b-wave{background:#7c3aed} .b-mic{background:#db2777} .b-rec{background:#d97706}
  label{font-size:11px;color:#94a3b8;display:block;margin-bottom:2px}
  input[type=range]{width:100%;height:26px;margin-bottom:8px}
  input[type=text]{width:100%;background:#0f172a;color:#00ffcc;border:1px solid #334155;padding:8px;border-radius:6px;margin-bottom:6px;font-size:12px}
  .log{max-height:95px;overflow-y:auto;font-size:11px;color:#cbd5e1;margin-top:8px;border-top:1px solid #1e293b;padding-top:6px}
</style>
</head>
<body>
<div class="panel">
  <h1>ANALIZADOR ACÚSTICO Y SÍNTESIS AV</h1>
  <canvas id="visor" width="400" height="160"></canvas>
  <div class="telemetry">
    <span id="lblFreq">TONO: 432 Hz</span>
    <span id="lblBand">BANDA: REPOSO</span>
    <span id="lblGain">AMP: 1.0x</span>
  </div>
  <div class="grid">
    <button class="b-play" id="btnPlay">▶ PLAY TONO</button>
    <button class="b-wave" id="btnWave">ONDA: SINE</button>
    <button class="b-mic" id="btnMic">🎙 ESCUCHAR MIC</button>
    <button class="b-rec" id="btnRec">● GRABAR AUDIO</button>
  </div>
  <label>SINTONIZADOR DE TONO (60 Hz - 1200 Hz):</label>
  <input type="range" id="rngFreq" min="60" max="1200" value="432">
  <label>AMPLIFICACIÓN DE ESCUCHA MICRÓFONO (1x - 10x):</label>
  <input type="range" id="rngGain" min="1" max="10" step="0.5" value="1">
  <div id="playerBox" style="margin-bottom:8px"></div>
  <input type="text" id="txtNota" placeholder="Escribe nota (o guarda lectura directa)...">
  <div class="grid">
    <button id="btnSave" style="background:#0f766e">GUARDAR LECTURA</button>
    <button id="btnExp" style="background:#475569">DESCARGAR .TXT</button>
  </div>
  <div class="log" id="logBox"></div>
</div>
<script>
(function(){
  var cv = document.getElementById("visor"), ctx = cv.getContext("2d");
  var actx = null, osc = null, synthGain = null, micGain = null, analyser = null, dest = null, micStream = null, rec = null, chunks = [];
  var playing = false, micOn = false, ondas = ["sine", "triangle", "square", "sawtooth"], wIdx = 0, freq = 432, ampVal = 1, bandTxt = "REPOSO";

  var lblFreq = document.getElementById("lblFreq"), lblBand = document.getElementById("lblBand"), lblGain = document.getElementById("lblGain");
  var btnPlay = document.getElementById("btnPlay"), btnWave = document.getElementById("btnWave"), btnMic = document.getElementById("btnMic"), btnRec = document.getElementById("btnRec");
  var rngFreq = document.getElementById("rngFreq"), rngGain = document.getElementById("rngGain"), playerBox = document.getElementById("playerBox");

  function initAudio(){
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    if(!analyser){ analyser = actx.createAnalyser(); analyser.fftSize = 256; }
    if(!dest) dest = actx.createMediaStreamDestination();
  }

  rngFreq.oninput = function(){ freq = parseInt(rngFreq.value); lblFreq.textContent = "TONO: " + freq + " Hz"; if(osc) osc.frequency.value = freq; };
  rngGain.oninput = function(){ ampVal = parseFloat(rngGain.value); lblGain.textContent = "AMP: " + ampVal.toFixed(1) + "x"; if(micGain) micGain.gain.value = ampVal; };
  btnWave.onclick = function(){ wIdx = (wIdx + 1) % ondas.length; btnWave.textContent = "ONDA: " + ondas[wIdx].toUpperCase(); if(osc) osc.type = ondas[wIdx]; };

  btnPlay.onclick = function(){
    initAudio();
    if(playing){ try{osc.stop();}catch(e){} osc = null; playing = false; btnPlay.textContent = "▶ PLAY TONO"; return; }
    osc = actx.createOscillator(); synthGain = actx.createGain(); synthGain.gain.value = 0.12;
    osc.type = ondas[wIdx]; osc.frequency.value = freq;
    osc.connect(synthGain); synthGain.connect(analyser); synthGain.connect(dest); synthGain.connect(actx.destination);
    osc.start(); playing = true; btnPlay.textContent = "❚❚ PAUSAR";
  };

  btnMic.onclick = async function(){
    initAudio();
    if(micOn){ micStream.getTracks().forEach(t=>t.stop()); micOn = false; btnMic.textContent = "🎙 ESCUCHAR MIC"; lblBand.textContent = "BANDA: REPOSO"; return; }
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true, autoGainControl:false}});
      var src = actx.createMediaStreamSource(micStream);
      var filter = actx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = 1000; filter.Q.value = 0.7;
      micGain = actx.createGain(); micGain.gain.value = ampVal;
      src.connect(filter); filter.connect(micGain); micGain.connect(analyser); micGain.connect(dest);
      micOn = true; btnMic.textContent = "⏹ PARAR MIC";
    }catch(e){ alert("Activa el permiso de micrófono en Safari."); }
  };
  btnRec.onclick = function(){
    initAudio();
    if(!playing && !micOn) btnPlay.click();
    if(rec && rec.state === "recording"){ rec.stop(); btnRec.textContent = "● GRABAR AUDIO"; return; }
    chunks = [];
    var mime = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm";
    rec = new MediaRecorder(dest.stream, {mimeType: mime});
    rec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      var url = URL.createObjectURL(new Blob(chunks, {type: mime}));
      playerBox.innerHTML = '<audio controls playsinline src="' + url + '" style="width:100%;height:36px"></audio>';
    };
    rec.start(); btnRec.textContent = "■ DETENER";
  };

  var logBox = document.getElementById("logBox"), txtNota = document.getElementById("txtNota");
  function renderLog(){
    var arr = JSON.parse(localStorage.getItem("radioplasma_log") || "[]");
    logBox.innerHTML = arr.map(x => "<div style='margin-bottom:3px'>• " + x + "</div>").join("");
  }
  renderLog();
  document.getElementById("btnSave").onclick = function(){
    var nota = txtNota.value.trim() || "Lectura automática";
    var hora = new Date().toLocaleTimeString();
    var arr = JSON.parse(localStorage.getItem("radioplasma_log") || "[]");
    arr.unshift("[" + hora + " | " + bandTxt + " | Amp " + ampVal + "x] " + nota);
    localStorage.setItem("radioplasma_log", JSON.stringify(arr.slice(0, 50)));
    txtNota.value = ""; renderLog();
  };
  document.getElementById("btnExp").onclick = function(){
    var arr = JSON.parse(localStorage.getItem("radioplasma_log") || "[]");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([arr.join("\n") || "Sin registros"], {type:"text/plain"}));
    a.download = "lecturas_acusticas.txt"; a.click();
  };

  function loop(){
    requestAnimationFrame(loop);
    ctx.fillStyle = "rgba(1,4,9,0.3)"; ctx.fillRect(0, 0, 400, 160);
    if(analyser && (playing || micOn)){
      var freqData = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqData);
      var graves = 0, medios = 0, agudos = 0;
      for(var i = 0; i < freqData.length; i++){
        if(i < 15) graves += freqData[i];
        else if(i < 60) medios += freqData[i];
        else agudos += freqData[i];
        var h = (freqData[i] / 255) * 140;
        ctx.fillStyle = i < 15 ? "#f59e0b" : (i < 60 ? "#00ffcc" : "#38bdf8");
        ctx.fillRect(i * 3.1, 160 - h, 2.5, h);
      }
      if(micOn){
        bandTxt = graves > medios && graves > agudos ? "GRAVE (BAJA)" : (medios > agudos ? "VOZ/MEDIA" : "AGUDA (ALTA)");
        lblBand.textContent = "BANDA: " + bandTxt;
      }
    }
  }
  loop();
})();
</script>
</body>
</html>
